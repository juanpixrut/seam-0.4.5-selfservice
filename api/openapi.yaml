openapi: 3.0.3
info:
  title: Seam AMS API
  description: |
    Asset Management System API for tracking and managing physical assets
    with IoT sensor integration, QR codes, and real-time monitoring.
  version: 0.1.0
  contact:
    name: Seam AMS
    url: https://github.com/ha1tch/seam
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Assets
    description: Asset management operations
  - name: Events
    description: Event ingestion and retrieval
  - name: QR Codes
    description: QR code generation and management
  - name: Rules
    description: Rules engine configuration
  - name: FSM
    description: Finite state machine management
  - name: Alerts
    description: Alert management
  - name: Webhooks
    description: Webhook subscriptions
  - name: Reports
    description: Reporting and analytics
  - name: Auth
    description: Authentication

paths:
  /assets:
    get:
      tags: [Assets]
      summary: List assets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            type: string
        - name: asset_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      tags: [Assets]
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset by ID
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Assets]
      summary: Update asset
      parameters:
        - $ref: '#/components/parameters/AssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdate'
      responses:
        '200':
          description: Asset updated
    delete:
      tags: [Assets]
      summary: Delete asset
      parameters:
        - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Asset deleted

  /events:
    get:
      tags: [Events]
      summary: List events
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: asset_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of events
    post:
      tags: [Events]
      summary: Ingest event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngest'
      responses:
        '201':
          description: Event created

  /events/batch:
    post:
      tags: [Events]
      summary: Batch ingest events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventIngest'
      responses:
        '200':
          description: Batch results

  /qr/generate:
    post:
      tags: [QR Codes]
      summary: Generate QR codes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  default: 1
                asset_type_id:
                  type: integer
      responses:
        '201':
          description: Generated codes

  /qr/{code}/scan:
    get:
      tags: [QR Codes]
      summary: Scan QR code (public)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scan result

  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved, dismissed]
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        '200':
          description: List of alerts

  /alerts/{id}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alert acknowledged

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Get dashboard statistics
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string

components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Asset:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        asset_type:
          type: string
        status:
          type: string
        location:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetCreate:
      type: object
      required: [name, asset_type]
      properties:
        name:
          type: string
        asset_type:
          type: string
        status:
          type: string
          default: active
        location:
          type: string
        metadata:
          type: object

    AssetUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        location:
          type: string
        metadata:
          type: object

    AssetList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    EventIngest:
      type: object
      required: [trigger_type, value]
      properties:
        asset_id:
          type: integer
        sensor_id:
          type: string
        trigger_type:
          type: string
        value:
          type: object
        timestamp:
          type: string
          format: date-time

    DashboardStats:
      type: object
      properties:
        total_assets:
          type: integer
        active_assets:
          type: integer
        total_events:
          type: integer
        events_today:
          type: integer
        alerts_open:
          type: integer
        assets_by_status:
          type: object
        assets_by_type:
          type: object

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - BearerAuth: []
  - ApiKeyAuth: []
